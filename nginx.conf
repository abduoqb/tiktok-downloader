server {
    listen 80;
    server_name _;  # Remplacez par votre domaine si vous en avez un

    client_max_body_size 100M;  # Pour permettre l'upload de gros fichiers

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support pour Server-Sent Events (SSE) - Logs en temps réel
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Servir les vidéos statiques directement (optionnel, pour de meilleures performances)
    location /videos/ {
        alias /home/tiktok/tiktok-scraper/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Logs
    access_log /var/log/nginx/tiktok-scraper-access.log;
    error_log /var/log/nginx/tiktok-scraper-error.log;
}
